server:
  port: 8080

spring:
  application:
    name: job-automation

  datasource:
    url: jdbc:postgresql://localhost:5432/job_automation
    username: ${USER:devanshisharma}
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  upload-dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    com.jobautomation: DEBUG
    org.hibernate.SQL: DEBUG
